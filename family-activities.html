<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الأنشطة المنزلية | SANAD</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background: #f6f5ef;
            font-family: Arial, sans-serif;
        }

        .activities-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .page-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-heading h1 {
            color: #285c45;
            font-size: 30px;
        }

        .page-heading p {
            color: #777;
            line-height: 1.9;
        }

        .child-info {
            background: #eaf3e9;
            color: #285c45;
            padding: 18px;
            border-radius: 15px;
            margin-bottom: 25px;
            line-height: 1.9;
        }

        .category-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .category-button {
            border: 1px solid #347653;
            background: white;
            color: #285c45;
            padding: 12px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
        }

        .category-button.active,
        .category-button:hover {
            background: #347653;
            color: white;
        }

        .activities-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .activity-card {
            background: white;
            padding: 23px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,.05);
        }

        .activity-icon {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .activity-card h3 {
            color: #285c45;
            margin: 8px 0;
        }

        .activity-card p {
            color: #666;
            line-height: 1.8;
        }

        .activity-details {
            background: #f4f7f2;
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            line-height: 1.9;
            color: #444;
        }

        .activity-details strong {
            color: #285c45;
        }

        .activity-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .action-button {
            border: none;
            padding: 11px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .speak-button {
            background: #e6efe6;
            color: #285c45;
        }

        .complete-button {
            background: #347653;
            color: white;
        }

        .complete-button.done {
            background: #dcefe0;
            color: #267044;
            cursor: default;
        }

        .summary-box {
            background: white;
            padding: 22px;
            border-radius: 18px;
            margin-top: 30px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,.05);
        }

        .summary-box h2 {
            color: #285c45;
        }

        .summary-number {
            font-size: 35px;
            color: #347653;
            font-weight: bold;
        }

        .empty-message {
            grid-column: 1 / -1;
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            color: #777;
            line-height: 1.8;
        }

        .back-button {
            display: block;
            width: fit-content;
            margin: 30px auto;
            background: #347653;
            color: white;
            padding: 13px 25px;
            border-radius: 10px;
            text-decoration: none;
        }

        button:focus-visible,
        a:focus-visible {
            outline: 3px solid #bd8b36;
            outline-offset: 3px;
        }

        @media(max-width: 650px) {
            .activities-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>

<body>

            <p>

        <!-- مكان ظهور الأنشطة -->

        </button>

            onclick="stopSpeaking()"

        </button>


        <a href="family-dashboard.html" class="back-button">
            العودة إلى لوحة الأسرة ←
        </a>

    </main>

                    steps: "قدمي شيئًا مألوفًا للطفل، واستخدمي الحواس أو وسائل التواصل المتاحة له للتعرف عليه.",
                    benefit: "تنمية الإدراك والانتباه.",
                    materials: "أشياء آمنة ومألوفة."
                },

                {
                    id: "multiple_family",
                    category: "family",
                    icon: "❤️",
                    title: "وقت عائلي",
                    description: "مشاركة الطفل في نشاط يحبه.",
                    steps: "اختاري نشاطًا يفضله الطفل، وشاركيه فيه مع احترام قدراته ووقت راحته.",
                    benefit: "تعزيز المشاركة والشعور بالانتماء.",
                    materials: "حسب النشاط المختار."
                },

                {
                    id: "multiple_movement",
                    category: "movement",
                    icon: "🏃",
                    title: "نشاط حركي مناسب",
                    description: "المشاركة في حركة بسيطة حسب قدرات الطفل.",
                    steps: "اختاري حركة آمنة تناسب قدرات الطفل، ويمكن أن تكون تحريك اليد أو لمس شيء قريب أو تحريك الرأس بمساعدة مناسبة.",
                    benefit: "تشجيع المشاركة الحركية والحسية.",
                    materials: "أدوات آمنة حسب النشاط."
                }

            ],


            // أنواع أخرى

            other: [

                {
                    id: "other_art",
                    category: "art",
                    icon: "🎨",
                    title: "الرسم والتلوين",
                    description: "نشاط فني حر.",
                    steps: "قدمي للطفل ورقة وألوانًا، وشجعيه على رسم شيء يحبه.",
                    benefit: "تنمية الإبداع والتعبير.",
                    materials: "ورقة وألوان."
                },

                {
                    id: "other_focus",
                    category: "focus",
                    icon: "🧩",
                    title: "مطابقة الصور",
                    description: "العثور على الصور المتشابهة.",
                    steps: "اعرضي صورًا مألوفة واطلبي من الطفل اختيار الصور المتطابقة.",
                    benefit: "تنمية التركيز والانتباه.",
                    materials: "بطاقات صور."
                },

                {
                    id: "other_family",
                    category: "family",
                    icon: "❤️",
                    title: "قصة مع الأسرة",
                    description: "قراءة قصة قصيرة ومناقشتها.",
                    steps: "اختاري قصة بسيطة، واقرئيها مع الطفل، واسأليه عن الشخصية التي أحبها.",
                    benefit: "تنمية التواصل والخيال.",
                    materials: "قصة مصورة."
                },

                {
                    id: "other_movement",
                    category: "movement",
                    icon: "🏃",
                    title: "حركة ولعب",
                    description: "تنفيذ حركة بسيطة وممتعة.",
                    steps: "اختاري حركة آمنة ومناسبة لعمر الطفل وقدراته، وشاركيه في تنفيذها.",
                    benefit: "تشجيع النشاط والمشاركة.",
                    materials: "مكان آمن للحركة."
                }

            ]

        };


        // =====================================
        // 4- توحيد أسماء الإعاقات
        // =====================================

        function normalizeDisability(type) {

            const aliases = {

                mobility: "physical",

                motor: "physical",

                learning_disabilities: "learning",

                learning_difficulties: "learning"

            };

            return aliases[type] || type || "other";

        }


        // =====================================
        // 5- تحميل بيانات الطفل والأنشطة
        // =====================================

        function initializePage() {

            const users = JSON.parse(
                localStorage.getItem("sanadUsers") || "[]"
            );

            child = users.find(user =>

                String(user.id) === String(currentUser.linkedChildId)
                &&
                user.accountType === "user"

            );


            if (!child) {

                document.getElementById("childName").textContent =
                    "لم يتم العثور على الطفل";

                document.getElementById("childDisability").textContent =
                    "غير متوفر";

                document.getElementById("activitiesGrid").innerHTML = `

                    <p class="empty-message">

                        لا يوجد طفل مرتبط بحسابك حتى الآن.

                        تأكدي من ربط حساب الأسرة بالحساب الشخصي.

                    </p>

                `;

                return;

            }


            // عرض اسم الطفل

            document.getElementById("childName").textContent =
                child.fullName || "غير متوفر";


            // تحديد نوع الإعاقة

            const disabilityType = normalizeDisability(
                child.disabilityType || child.disability
            );


            document.getElementById("childDisability").textContent =
                disabilityNames[child.disabilityType] ||
                disabilityNames[disabilityType] ||
                "أخرى";


            // تحميل الأنشطة المناسبة

            activities = activityLibrary[disabilityType] ||
                activityLibrary.other;


            // تحميل الأنشطة المكتملة

            const storageKey =
                "sanadFamilyActivities_" + child.id;

            completedActivities = JSON.parse(
                localStorage.getItem(storageKey) || "[]"
            );


            displayActivities();

            updateSummary();

        }


        // =====================================
        // 6- عرض الأنشطة
        // =====================================

        function displayActivities(category = "all") {

            currentCategory = category;

            const grid = document.getElementById("activitiesGrid");

            grid.innerHTML = "";


            const filteredActivities = activities.filter(activity => {

                return category === "all" ||
                    activity.category === category;

            });


            // لو مفيش أنشطة في التصنيف

            if (filteredActivities.length === 0) {

                grid.innerHTML = `

                    <p class="empty-message">

                        لا توجد أنشطة في هذا التصنيف حاليًا.

                        جربي اختيار تصنيف آخر.

                    </p>

                `;

                return;

            }


            filteredActivities.forEach(activity => {

                const isDone =
                    completedActivities.includes(activity.id);


                const card = document.createElement("article");

                card.className = "activity-card";


                const icon = document.createElement("div");

                icon.className = "activity-icon";

                icon.textContent = activity.icon;


                const title = document.createElement("h3");

                title.textContent = activity.title;


                const description = document.createElement("p");

                description.textContent = activity.description;


                const details = document.createElement("div");

                details.className = "activity-details";

                details.innerHTML = `

                    <strong>طريقة التنفيذ:</strong>

                    <br>

                    ${escapeHTML(activity.steps)}

                    <br><br>

                    <strong>الفائدة:</strong>

                    <br>

                    ${escapeHTML(activity.benefit)}

                    <br><br>

                    <strong>الأدوات:</strong>

                    <br>

                    ${escapeHTML(activity.materials)}

                `;


                const actions = document.createElement("div");

                actions.className = "activity-actions";


                // زر القراءة الصوتية

                const speakButton = document.createElement("button");

                speakButton.className =
                    "action-button speak-button";

                speakButton.textContent = "🔊 اسمعي التعليمات";

                speakButton.addEventListener("click", function() {

                    speakText(

                        activity.title + ". " +

                        activity.description + ". " +

                        "طريقة التنفيذ: " +

                        activity.steps + ". " +

                        "الفائدة: " +

                        activity.benefit

                    );

                });


                // زر تسجيل النشاط

                const completeButton = document.createElement("button");

                completeButton.className =
                    "action-button complete-button";

                completeButton.textContent = isDone ?

                    "✓ تم تنفيذ النشاط" :

                    "تسجيل تنفيذ النشاط";


                if (isDone) {

                    completeButton.classList.add("done");

                    completeButton.disabled = true;

                } else {

                    completeButton.addEventListener("click", function() {

                        completeActivity(activity.id);

                    });

                }


                actions.appendChild(speakButton);

                actions.appendChild(completeButton);


                card.appendChild(icon);

                card.appendChild(title);

                card.appendChild(description);

                card.appendChild(details);

                card.appendChild(actions);


                grid.appendChild(card);

            });

        }


        // =====================================
        // 7- تسجيل النشاط كمكتمل
        // =====================================

        function completeActivity(activityId) {

            if (completedActivities.includes(activityId)) {

                return;

            }


            completedActivities.push(activityId);


            const storageKey =
                "sanadFamilyActivities_" + child.id;


            localStorage.setItem(

                storageKey,

                JSON.stringify(completedActivities)

            );


            displayActivities(currentCategory);

            updateSummary();


            alert("رائع! تم تسجيل النشاط بنجاح ❤️");

        }


        // =====================================
        // 8- تحديث الإنجازات
        // =====================================

        function updateSummary() {

            document.getElementById("completedNumber").textContent =
                completedActivities.length;


            if (completedActivities.length === 0) {

                document.getElementById("summaryMessage").textContent =

                    "ابدئي أول نشاط مع طفلك واستمتعا بالتعلم معًا.";

            }

            else if (completedActivities.length === activities.length) {

                document.getElementById("summaryMessage").textContent =

                    "أحسنتم! أكملتم كل الأنشطة المتاحة في هذه الصفحة.";

            }

            else {

                document.getElementById("summaryMessage").textContent =

                    "أحسنتم! استمروا في المشاركة والتعلم معًا.";

            }

        }


        // =====================================
        // 9- تصفية الأنشطة حسب النوع
        // =====================================

        document.querySelectorAll(".category-button").forEach(button => {

            button.addEventListener("click", function() {

                document.querySelectorAll(".category-button")
                    .forEach(item => {

                        item.classList.remove("active");

                    });


                this.classList.add("active");


                displayActivities(this.dataset.category);

            });

        });


        // =====================================
        // 10- القراءة الصوتية
        // =====================================

        function speakText(text) {

            if (!("speechSynthesis" in window)) {

                alert("المتصفح لا يدعم خاصية القراءة الصوتية.");

                return;

            }


            speechSynthesis.cancel();


            const speech = new SpeechSynthesisUtterance(text);

            speech.lang = "ar-EG";

            speech.rate = 0.85;

            speechSynthesis.speak(speech);

        }


        function speakPage() {

            speakText(

                "مرحبًا بك في الأنشطة المنزلية من سند. " +

                "اختاري النشاط المناسب لطفلك، " +

                "واقرئي التعليمات أو استمعي إليها، " +

                "ثم سجلي النشاط بعد تنفيذه."

            );

        }


        function stopSpeaking() {

            if ("speechSynthesis" in window) {

                speechSynthesis.cancel();

            }

        }


        // =====================================
        // 11- حماية النصوص
        // =====================================

        function escapeHTML(value) {

            return String(value).replace(/[&<>"']/g, function(character) {

                const characters = {

                    "&": "&amp;",

                    "<": "&lt;",

                    ">": "&gt;",

                    '"': "&quot;",

                    "'": "&#039;"

                };

                return characters[character];

            });

        }


        // =====================================
        // 12- التحقق من الحساب وبدء الصفحة
        // =====================================

        if (!currentUser || currentUser.accountType !== "family") {

            window.location.href = "login.html";

        } else {

            initializePage();

        }

    </script>

</body>
