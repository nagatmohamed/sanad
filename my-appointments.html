<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مواعيدي | SANAD</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7f2;
            color: #33483d;
        }

        .appointments-header {
            background: #557963;
            color: white;
            padding: 25px 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .appointments-header h1 {
            margin: 0;
            font-size: 26px;
        }

        .appointments-header p {
            margin: 8px 0 0;
            color: #e6eee8;
        }

        .back-btn {
            background: white;
            color: #557963;
            padding: 12px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }

        .appointments-container {
            width: 90%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .appointments-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            padding: 22px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.04);
        }

        .summary-card h3 {
            margin: 0 0 10px;
            color: #718579;
            font-size: 15px;
        }

        .summary-card span {
            font-size: 28px;
            font-weight: bold;
            color: #557963;
        }

        .appointments-title {
            margin: 30px 0 20px;
        }

        .appointments-title h2 {
            margin-bottom: 8px;
        }

        .appointments-title p {
            color: #7b897f;
        }

        .appointments-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .appointment-card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            border-right: 5px solid #8cae98;
        }

        .appointment-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .specialist-info h3 {
            margin: 0 0 7px;
            color: #45644f;
            font-size: 20px;
        }

        .specialist-info p {
            margin: 0;
            color: #89958c;
            font-size: 14px;
        }

        .status {
            padding: 9px 15px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: bold;
        }

        .status-pending {
            background: #fff4d7;
            color: #9a751d;
        }

        .status-accepted {
            background: #e1f4e5;
            color: #347a48;
        }

        .status-rejected {
            background: #fde6e6;
            color: #b34848;
        }

        .status-cancelled {
            background: #eeeeee;
            color: #777777;
        }

        .appointment-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .detail-box {
            background: #f7f9f6;
            padding: 14px;
            border-radius: 12px;
        }

        .detail-box small {
            display: block;
            color: #87938a;
            margin-bottom: 7px;
        }

        .detail-box strong {
            color: #46594d;
        }

        .appointment-notes {
            background: #f7f9f6;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 18px;
            line-height: 1.8;
        }

        .appointment-notes strong {
            display: block;
            margin-bottom: 5px;
        }

        .cancel-btn {
            background: #fff;
            color: #bd6666;
            border: 1px solid #e6bcbc;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .cancel-btn:hover {
            background: #fff0f0;
        }

        .empty-state {
            text-align: center;
            background: white;
            padding: 55px 20px;
            border-radius: 20px;
        }

        .empty-state .empty-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .empty-state h3 {
            color: #557963;
        }

        .empty-state p {
            color: #89958c;
            line-height: 1.8;
        }

        .book-btn {
            display: inline-block;
            margin-top: 15px;
            background: #557963;
            color: white;
            text-decoration: none;
            padding: 13px 25px;
            border-radius: 10px;
        }

        .page-footer {
            text-align: center;
            padding: 25px;
            color: #89958c;
            font-size: 14px;
        }

        @media (max-width: 650px) {
            .appointments-summary {
                grid-template-columns: 1fr;
            }

            .appointment-details {
                grid-template-columns: 1fr;
            }

            .appointments-header {
                padding: 20px;
            }

            .appointments-container {
                width: 94%;
            }

            .appointment-card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <header class="appointments-header">
        <div>
            <h1>📅 مواعيدي</h1>
            <p>تابع حجوزاتك وجلساتك مع الأخصائيين</p>
        </div>

        <a href="user-dashboard.html" class="back-btn">← العودة للوحة التحكم</a>
    </header>

    <main class="appointments-container">

        <section class="appointments-summary">

            <div class="summary-card">
                <h3>إجمالي الحجوزات</h3>
                <span id="totalAppointments">0</span>
            </div>

            <div class="summary-card">
                <h3>طلبات قيد الانتظار</h3>
                <span id="pendingAppointments">0</span>
            </div>

            <div class="summary-card">
                <h3>الحجوزات المقبولة</h3>
                <span id="acceptedAppointments">0</span>
            </div>

        </section>

        <section>

            <div class="appointments-title">
                <h2>📋 قائمة حجوزاتي</h2>
                <p>هنا هتلاقي كل طلبات الحجز اللي قدمتها للأخصائيين.</p>
            </div>

            <div id="appointmentsList" class="appointments-list"></div>

        </section>

    </main>

    <footer class="page-footer">
        SANAD | سند — معًا نحو حياة أفضل 💚
    </footer>

    <script>
        const currentUser = JSON.parse(localStorage.getItem("sanadCurrentUser"));

        if (!currentUser || currentUser.accountType !== "user") {
            alert("يجب تسجيل الدخول أولاً");
            window.location.href = "login.html";
        }

        const appointmentsList = document.getElementById("appointmentsList");

        function getAppointments() {
            return JSON.parse(localStorage.getItem("sanadAppointments")) || [];
        }

        function saveAppointments(appointments) {
            localStorage.setItem("sanadAppointments", JSON.stringify(appointments));
        }

        function getStatusInfo(status) {
            switch (status) {
                case "accepted":
                    return {
                        text: "تم قبول الحجز",
                        className: "status-accepted"
                    };

                case "rejected":
                    return {
                        text: "تم رفض الحجز",
                        className: "status-rejected"
                    };

                case "cancelled":
                    return {
                        text: "تم إلغاء الحجز",
                        className: "status-cancelled"
                    };

                default:
                    return {
                        text: "قيد الانتظار",
                        className: "status-pending"
                    };
            }
        }

        function formatDate(dateString) {
            if (!dateString) return "غير محدد";

            const date = new Date(dateString + "T00:00:00");

            if (isNaN(date.getTime())) return dateString;

            return date.toLocaleDateString("ar-EG", {
                year: "numeric",
                month: "long",
                day: "numeric"
            });
        }

        function renderAppointments() {
            const allAppointments = getAppointments();

            // عرض حجوزات المستخدم الحالي فقط
            const myAppointments = allAppointments.filter(appointment =>
                String(appointment.requesterId) === String(currentUser.id)
            );

            // ترتيب المواعيد من الأحدث للأقدم
            myAppointments.sort((a, b) => {
                return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
            });

            // تحديث الإحصائيات
            document.getElementById("totalAppointments").textContent =
                myAppointments.length;

            document.getElementById("pendingAppointments").textContent =
                myAppointments.filter(a => a.status === "pending").length;

            document.getElementById("acceptedAppointments").textContent =
                myAppointments.filter(a => a.status === "accepted").length;

            if (myAppointments.length === 0) {
                appointmentsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📅</div>
                        <h3>لسه مفيش حجوزات</h3>
                        <p>
                            لما تحجز موعد مع أحد الأخصائيين،<br>
                            هتلاقي تفاصيل الحجز هنا.
                        </p>
                        <a href="specialists.html" class="book-btn">
                            احجز مع أخصائي
                        </a>
                    </div>
                `;
                return;
            }

            appointmentsList.innerHTML = myAppointments.map(appointment => {

                const statusInfo = getStatusInfo(appointment.status);

                const sessionType =
                    appointment.sessionType === "online"
                        ? "💻 جلسة أونلاين"
                        : "🏥 جلسة حضورية";

                return `
                    <div class="appointment-card">

                        <div class="appointment-top">

                            <div class="specialist-info">
                                <h3>👨‍⚕️ ${appointment.specialistName || "الأخصائي"}</h3>
                                <p>رقم الحجز: ${appointment.id || "غير متوفر"}</p>
                            </div>

                            <span class="status ${statusInfo.className}">
                                ${statusInfo.text}
                            </span>

                        </div>

                        <div class="appointment-details">

                            <div class="detail-box">
                                <small>📅 تاريخ الجلسة</small>
                                <strong>${formatDate(appointment.date)}</strong>
                            </div>

                            <div class="detail-box">
                                <small>🕒 موعد الجلسة</small>
                                <strong>${appointment.time || "غير محدد"}</strong>
                            </div>

                            <div class="detail-box">
                                <small>📍 نوع الجلسة</small>
                                <strong>${sessionType}</strong>
                            </div>

                            <div class="detail-box">
                                <small>👤 اسم المستفيد</small>
                                <strong>${appointment.childName || currentUser.name || "غير محدد"}</strong>
                            </div>

                        </div>

                        ${appointment.notes ? `
                            <div class="appointment-notes">
                                <strong>📝 ملاحظات الحجز</strong>
                                ${appointment.notes}
                            </div>
                        ` : ""}

                        ${appointment.status === "pending" ? `
                            <button class="cancel-btn" onclick="cancelAppointment('${appointment.id}')">
                                إلغاء طلب الحجز
                            </button>
                        ` : ""}

                    </div>
                `;
            }).join("");
        }

        function cancelAppointment(appointmentId) {
            if (!confirm("هل أنت متأكد من إلغاء طلب الحجز؟")) {
                return;
            }

            const appointments = getAppointments();

            const appointment = appointments.find(a =>
                String(a.id) === String(appointmentId)
            );

            if (!appointment) {
                alert("الحجز غير موجود");
                return;
            }

            if (appointment.status !== "pending") {
                alert("لا يمكن إلغاء هذا الحجز");
                return;
            }

            appointment.status = "cancelled";

            saveAppointments(appointments);

            alert("تم إلغاء طلب الحجز بنجاح");

            renderAppointments();
        }

        // تحديث الصفحة عند حدوث تغييرات في الحجوزات
        window.addEventListener("storage", renderAppointments);

        renderAppointments();
    </script>

</body>
</html>
